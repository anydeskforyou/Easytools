<p>
PDF file चुनें और उसके सभी pages को JPG images में convert करें।
</p>

<input id="file" type="file" accept="application/pdf">

<br>

<button class="primary" onclick="convertPDF()">
Convert Pages
</button>

<div id="out"></div>

</main>

<footer>
© 2026 Amit Online Tools
</footer>

<script>

async function convertPDF(){

let f=file.files[0];

if(!f){
alert("PDF चुनें");
return;
}

out.innerHTML="⏳ PDF process हो रही है...";

let data=new Uint8Array(
await f.arrayBuffer()
);

let pdf=await pdfjsLib
.getDocument({data:data})
.promise;

out.innerHTML="";

for(let p=1;p<=pdf.numPages;p++){

let page=await pdf.getPage(p);

let viewport=page.getViewport({
scale:1.5
});

let canvas=document.createElement("canvas");

canvas.width=viewport.width;
canvas.height=viewport.height;

await page.render({
canvasContext:canvas.getContext("2d"),
viewport:viewport
}).promise;

let blob=await new Promise(resolve=>{
canvas.toBlob(resolve,"image/jpeg",0.9);
});

let url=URL.createObjectURL(blob);

let div=document.createElement("div");

div.className="page";

div.innerHTML=`
<h3>Page ${p}</h3>
`;

div.appendChild(canvas);

let br=document.createElement("br");

div.appendChild(br);

let a=document.createElement("a");

a.href=url;
a.download="page-"+p+".jpg";

let button=document.createElement("button");

button.className="primary";
button.textContent="⬇️ Download Page "+p;

a.appendChild(button);

div.appendChild(a);

out.appendChild(div);

}

}

</script>
