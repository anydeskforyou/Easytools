<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EMI Calculator Online - Loan EMI Calculate करें</title>

<meta name="description" content="Free EMI Calculator Online. Loan Amount, Interest Rate और Loan Duration डालकर Monthly EMI, Total Payment और Total Interest calculate करें।">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://anydeskforyou.github.io/Easytools/emi-calculator.html">

<style>
body{margin:0;font-family:Arial,"Noto Sans Devanagari";background:#f5f7fb;color:#172033}
header,footer{background:#16213e;color:white;padding:18px}
nav{max-width:900px;margin:auto;display:flex;justify-content:space-between}
nav a{color:white}
main{max-width:700px;margin:auto;padding:30px 15px}
.tool{background:white;padding:30px;border-radius:15px;box-shadow:0 3px 15px #0001}
input,button{padding:12px;margin:7px;border-radius:8px;width:100%;max-width:450px}
.primary{background:#315b96;color:white;border:0;cursor:pointer}
.back{display:inline-block;background:#e9eef8;padding:10px 15px;border-radius:8px;text-decoration:none;color:#172033}
.result{background:#f1f5fb;padding:18px;border-radius:10px;margin-top:20px;line-height:2}
footer{text-align:center;margin-top:40px}
</style>
</head>

<body>

<header>
<nav>
<b>🛠️ Amit Online Tools</b>
<a href="index.html">Home</a>
</nav>
</header>

<main>

<div class="tool">

<a class="back" href="index.html">← सभी Tools</a>

<h1>💰 EMI Calculator</h1>

<p>
Loan की Monthly EMI और Total Interest आसानी से calculate करें।
</p>

<label>Loan Amount ₹</label>

<br>

<input id="loan" type="number" placeholder="जैसे 500000">

<br>

<label>Annual Interest Rate %</label>

<br>

<input id="rate" type="number" step="0.01" placeholder="जैसे 8.5">

<br>

<label>Loan Duration (Months)</label>

<br>

<input id="months" type="number" placeholder="जैसे 60">

<br>

<button class="primary" onclick="calculateEMI()">
Calculate EMI
</button>

<div id="result"></div>

</div>

</main>

<footer>
© 2026 Amit Online Tools
</footer>

<script>

function calculateEMI(){

let P=parseFloat(loan.value);

let annualRate=parseFloat(rate.value);

let n=parseInt(months.value);

if(!P || annualRate<0 || !n){

alert("सभी जानकारी सही तरीके से भरें");

return;

}

let r=annualRate/12/100;

let emi;

if(r===0){

emi=P/n;

}else{

emi=
P*r*Math.pow(1+r,n)/
(
Math.pow(1+r,n)-1
);

}

let total=emi*n;

let interest=total-P;

result.innerHTML=`

<div class="result">

<b>💰 Monthly EMI:</b>
₹${emi.toFixed(2)}

<br>

<b>💳 Total Payment:</b>
₹${total.toFixed(2)}

<br>

<b>📈 Total Interest:</b>
₹${interest.toFixed(2)}

</div>

`;

}

</script>

</body>
</html>
