<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f5f7fb;color:#172033}
header{background:#16213e;color:white;padding:16px}
nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between}

main{max-width:900px;margin:auto;padding:30px 16px}
.tool{background:white;padding:28px;border-radius:15px;box-shadow:0 3px 15px #0001}

<body>

<header>
<nav>
<div class="logo">🛠️ Amit Online Tools</div>
<a href="index.html">← Home</a>
</nav>
</header>

<main>
<div class="tool">

<a class="back" href="index.html">← सभी Tools</a>

<h1>📐 Image Resizer Online</h1>

<p>Photo की Width और Height अपनी जरूरत के अनुसार बदलें।</p>

<input id="file" type="file" accept="image/*">

<br>

<input id="width" type="number" value="300" placeholder="Width">

<input id="height" type="number" value="400" placeholder="Height">

<br>

<label>
<input id="keep" type="checkbox" checked>
Aspect Ratio बनाए रखें
</label>

<br>

<button class="primary" onclick="resizeImage()">Resize करें</button>

<div id="out"></div>

</div>
</main>

<footer>
© 2026 Amit Online Tools • Free Online Tools
</footer>

<script>

let originalRatio=1;

file.onchange=function(){

let img=new Image();

img.onload=function(){

originalRatio=img.width/img.height;

};

img.src=URL.createObjectURL(file.files[0]);

};

function resizeImage(){

let f=file.files[0];

if(!f){
alert("Photo चुनें");
return;
}

let img=new Image();

img.onload=function(){

let w=parseInt(width.value);
let h=parseInt(height.value);

if(!w || !h){
alert("Width और Height भरें");
return;
}

if(keep.checked){
h=Math.round(w/originalRatio);
height.value=h;
}

let canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

canvas.getContext("2d").drawImage(
img,0,0,w,h
);

canvas.toBlob(function(blob){

let url=URL.createObjectURL(blob);

out.innerHTML=`
<p><b>New Size:</b> ${w} × ${h} px</p>
<canvas id="preview"></canvas>
<br>
<a href="${url}" download="resized-image.jpg">
<button class="primary">⬇️ Download Image</button>
</a>
`;

let p=document.getElementById("preview");

p.width=w;
p.height=h;

p.getContext("2d").drawImage(canvas,0,0);

},"image/jpeg",0.9);

};

img.src=URL.createObjectURL(f);

}

</script>

</body>
