<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Image Cropper Online - Photo Crop करें | Amit Online Tools</title>

<meta name="description" content="Free Image Cropper Online. Photo को Square, Passport और 16:9 ratio में आसानी से crop करें।">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://anydeskforyou.github.io/Easytools/image-cropper.html">

<style>
body{margin:0;font-family:Arial,"Noto Sans Devanagari";background:#f5f7fb;color:#172033}
header,footer{background:#16213e;color:white;padding:18px}
nav{max-width:900px;margin:auto;display:flex;justify-content:space-between}
nav a{color:white}
main{max-width:900px;margin:auto;padding:30px 15px}
.tool{background:white;padding:25px;border-radius:15px;box-shadow:0 3px 15px #0001}
input,select,button{padding:11px;margin:7px;border-radius:8px}
.primary{background:#315b96;color:white;border:0}
.back{display:inline-block;background:#e9eef8;padding:10px 15px;border-radius:8px;text-decoration:none;color:#172033}
canvas{max-width:100%;border:1px solid #ddd;margin-top:15px}
footer{text-align:center;margin-top:40px}
</style>
</head>

<body>

<header>
<nav>
<b>🛠️ Amit Online Tools</b>
<a href="index.html">Home</a>
</nav>
</header>

<main>
<div class="tool">

<a class="back" href="index.html">← सभी Tools</a>

<h1>✂️ Image Cropper Online</h1>

<p>Photo को अपनी जरूरत के अनुसार crop करें।</p>

<input id="file" type="file" accept="image/*">

<br>

<select id="ratio">
<option value="1">Square 1:1</option>
<option value="0.75">Passport 3:4</option>
<option value="1.777">16:9</option>
</select>

<br>

<button class="primary" onclick="cropImage()">
Crop Image
</button>

<div id="out"></div>

</div>
</main>

<footer>
© 2026 Amit Online Tools
</footer>

<script>

function cropImage(){

let f=file.files[0];

if(!f){
alert("Photo चुनें");
return;
}

let img=new Image();

img.onload=function(){

let r=parseFloat(ratio.value);

let sw=img.width;
let sh=img.height;

if(sw/sh>r){
sw=sh*r;
}else{
sh=sw/r;
}

let sx=(img.width-sw)/2;
let sy=(img.height-sh)/2;

let w=600;
let h=w/r;

let canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

canvas.getContext("2d").drawImage(
img,
sx,sy,sw,sh,
0,0,w,h
);

canvas.toBlob(function(blob){

let url=URL.createObjectURL(blob);

out.innerHTML=`
<canvas id="preview"></canvas>
<br>
<a href="${url}" download="cropped-image.jpg">
<button class="primary">⬇️ Download Cropped Image</button>
</a>
`;

let p=document.getElementById("preview");

p.width=w;
p.height=h;

p.getContext("2d").drawImage(canvas,0,0);

},"image/jpeg",0.9);

};

img.src=URL.createObjectURL(f);

}

</script>

</body>
</html>
