<div class="tool">

<h1>📸 Image Compressor Online</h1>

<p>
अपनी Photo का file size कम करें। यह free online image compressor
आपके browser में काम करता है।
</p>

<input id="file" type="file" accept="image/*">

<br>

<label>Quality:</label>
<input id="quality" type="range" min="0.1" max="1" step="0.1" value="0.7">

<span id="qualityValue">70%</span>

<br>

<button class="primary" onclick="compress()">Compress Image</button>

<div id="out"></div>

</div>

</main>

<footer>
© 2026 Amit Online Tools • Free Online Tools
</footer>

<script>

quality.oninput=function(){
qualityValue.innerText=Math.round(quality.value*100)+"%";
};

function compress(){

let f=file.files[0];

if(!f){
alert("पहले Photo चुनें");
return;
}

let img=new Image();

img.onload=function(){

let canvas=document.createElement("canvas");

let max=1600;

let scale=Math.min(
1,
max/Math.max(img.width,img.height)
);

canvas.width=img.width*scale;
canvas.height=img.height*scale;

let ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

let q=parseFloat(quality.value);

canvas.toBlob(function(blob){

let url=URL.createObjectURL(blob);

out.innerHTML=`
<div class="result">

<b>Original Size:</b>
${(f.size/1024).toFixed(1)} KB

<br>

<b>Compressed Size:</b>
${(blob.size/1024).toFixed(1)} KB

<br><br>

<canvas id="preview"></canvas>

<br>

<a href="${url}" download="compressed-image.jpg">
<button class="primary">⬇️ Download Compressed Image</button>
</a>

</div>
`;

let p=document.getElementById("preview");

p.width=canvas.width;
p.height=canvas.height;

p.getContext("2d").drawImage(canvas,0,0);

},"image/jpeg",q);

};

img.src=URL.createObjectURL(f);

}

</script>
