<h1>🎂 Age Calculator</h1>

<p>
अपनी Date of Birth डालकर exact age calculate करें।
</p>

<label>Date of Birth</label>

<br>

<input id="dob" type="date">

<br>

<button class="primary" onclick="calculateAge()">
Calculate Age
</button>

<div id="result"></div>

</div>

</main>

<footer>
© 2026 Amit Online Tools
</footer>

<script>

function calculateAge(){

let value=dob.value;

if(!value){
alert("Date of Birth चुनें");
return;
}

let birth=new Date(value+"T00:00:00");

let today=new Date();

if(birth>today){
alert("Future की date valid नहीं है");
return;
}

let years=today.getFullYear()-birth.getFullYear();

let months=today.getMonth()-birth.getMonth();

let days=today.getDate()-birth.getDate();

if(days<0){

months--;

let previousMonth=
new Date(
today.getFullYear(),
today.getMonth(),
0
).getDate();

days+=previousMonth;

}

if(months<0){

years--;

months+=12;

}

result.innerHTML=`

<div class="result">

🎂 आपकी उम्र:

<br><br>

<b>
${years} वर्ष,
${months} महीने,
${days} दिन
</b>

</div>

`;

}

</script>
