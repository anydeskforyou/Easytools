<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PNG to JPG Converter Online - Free Image Converter</title>

<meta name="description" content="Free PNG to JPG Converter Online. PNG image को JPG format में आसानी से convert और download करें।">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://anydeskforyou.github.io/Easytools/png-to-jpg.html">

<style>
body{margin:0;font-family:Arial,"Noto Sans Devanagari";background:#f5f7fb;color:#172033}
header,footer{background:#16213e;color:white;padding:18px}
nav{max-width:900px;margin:auto;display:flex;justify-content:space-between}
nav a{color:white}
main{max-width:900px;margin:auto;padding:30px 15px}
.tool{background:white;padding:25px;border-radius:15px;box-shadow:0 3px 15px #0001}
input,button{padding:11px;margin:7px;border-radius:8px}
.primary{background:#315b96;color:white;border:0}
.back{display:inline-block;background:#e9eef8;padding:10px 15px;border-radius:8px;text-decoration:none;color:#172033}
canvas{max-width:100%;border:1px solid #ddd;margin-top:15px}
footer{text-align:center;margin-top:40px}
</style>
</head>

<body>

<header>
<nav>
<b>🛠️ Amit Online Tools</b>
<a href="index.html">Home</a>
</nav>
</header>

<main>

<div class="tool">

<a class="back" href="index.html">← सभी Tools</a>

<h1>🔄 PNG to JPG Converter</h1>

<p>PNG image को JPG image में convert करें।</p>

<input id="file" type="file" accept="image/png,image/*">

<br>

<button class="primary" onclick="convert()">
Convert to JPG
</button>

<div id="out"></div>

</div>

</main>

<footer>
© 2026 Amit Online Tools
</footer>

<script>

function convert(){

let f=file.files[0];

if(!f){
alert("Image चुनें");
return;
}

let img=new Image();

img.onload=function(){

let canvas=document.createElement("canvas");

canvas.width=img.width;
canvas.height=img.height;

let ctx=canvas.getContext("2d");

ctx.fillStyle="white";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.drawImage(img,0,0);

canvas.toBlob(function(blob){

let url=URL.createObjectURL(blob);

out.innerHTML=`
<canvas id="preview"></canvas>
<br>
<a href="${url}" download="converted.jpg">
<button class="primary">⬇️ Download JPG</button>
</a>
`;

let p=document.getElementById("preview");

p.width=canvas.width;
p.height=canvas.height;

p.getContext("2d").drawImage(canvas,0,0);

},"image/jpeg",0.9);

};

img.src=URL.createObjectURL(f);

}

</script>

</body>
</html>
